<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neeraj Prakash — AI Product Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ EDIT YOUR CONTENT IN THE CONFIG SCRIPT AT THE BOTTOM ============ */
:root{
  --bg:#0D0C0B; --accent:#E1502A; --cream:#ECE6D8;
  --display:'Anton',sans-serif; --body:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--cream);font-family:var(--body);overflow-x:hidden}
::selection{background:var(--accent);color:var(--bg)}

/* grain */
.grain{position:fixed;inset:-100%;width:300%;height:300%;pointer-events:none;z-index:9999;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grain 8s steps(10) infinite}
@keyframes grain{
  0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-10%)}20%{transform:translate(-15%,5%)}
  30%{transform:translate(7%,-25%)}40%{transform:translate(-5%,25%)}50%{transform:translate(-15%,10%)}
  60%{transform:translate(15%,0)}70%{transform:translate(0,15%)}80%{transform:translate(3%,35%)}90%{transform:translate(-10%,10%)}
}

/* progress bar */
.progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:1000}

/* nav */
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:22px 40px;z-index:900;mix-blend-mode:difference}
nav .logo{font-family:var(--display);font-size:20px;letter-spacing:.05em;color:var(--cream);text-decoration:none}
nav a.cta{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--cream);text-decoration:none;
  border:1px solid rgba(236,230,216,.4);padding:10px 22px;border-radius:100px;transition:.3s}
nav a.cta:hover{background:var(--cream);color:#000}

/* ============ HERO ============ */
.hero{height:300vh;position:relative}
.hero-pin{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-stage{position:absolute;inset:0;perspective:1200px;display:flex;align-items:center;justify-content:center}
.hero-img-wrap{position:absolute;inset:0;will-change:transform;transform-style:preserve-3d}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:contrast(1.08) saturate(1.05)}
.hero-vignette{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 60% at 50% 45%,transparent 30%,rgba(13,12,11,.85) 90%),
  linear-gradient(to bottom,rgba(13,12,11,.5),transparent 25%,transparent 70%,var(--bg))}
.hero-sweep{position:absolute;inset:0;background:radial-gradient(ellipse 40% 80% at var(--sx,20%) 50%,rgba(225,80,42,.18),transparent 60%);mix-blend-mode:screen}
.hero-fallback{position:absolute;inset:0;background:
  radial-gradient(ellipse 45% 70% at 50% 55%,rgba(225,80,42,.25),transparent 65%),
  radial-gradient(ellipse 30% 55% at 50% 60%,rgba(225,80,42,.35),transparent 70%),#0D0C0B;display:none}
.hero-title{position:absolute;z-index:5;left:6vw;bottom:14vh;text-align:left;pointer-events:none;max-width:60vw}
.hero-kicker{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;opacity:0}
.hero-title h1{font-family:var(--display);font-size:clamp(34px,5.2vw,84px);line-height:.98;letter-spacing:.02em;
  color:var(--cream);text-transform:uppercase;text-shadow:0 2px 30px rgba(13,12,11,.8)}
.hero-title h1 .ln{display:inline-block;overflow:hidden;margin-right:.35em}
.hero-title h1 .ch{display:inline-block;transform:translateY(110%);will-change:transform}
.hero-sub{margin-top:14px;font-size:clamp(13px,1.3vw,17px);font-weight:300;letter-spacing:.06em;color:rgba(236,230,216,.8);opacity:0;max-width:520px;line-height:1.6}
.hero-sub .accent{color:var(--accent);font-weight:500}
.scroll-hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:6;font-size:11px;
  letter-spacing:.3em;text-transform:uppercase;color:rgba(236,230,216,.5);display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-hint::after{content:'';width:1px;height:44px;background:linear-gradient(var(--accent),transparent);animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ============ STATS ============ */
.stats{padding:16vh 6vw;border-top:1px solid rgba(236,230,216,.08)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:40px;max-width:1400px;margin:0 auto}
.stat{border-left:2px solid var(--accent);padding-left:24px}
.stat .num{font-family:var(--display);font-size:clamp(56px,7vw,110px);line-height:1;color:var(--cream)}
.stat .num sup{font-size:.4em;color:var(--accent);top:-0.9em}
.stat .lbl{margin-top:10px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,230,216,.55)}

/* ============ SECTION SHARED ============ */
.kicker{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.big{font-family:var(--display);text-transform:uppercase;color:var(--cream);line-height:.95}

/* ============ PILLARS ============ */
.pillars{position:relative;min-height:100vh;padding:18vh 6vw;overflow:hidden}
.pillars-bg{position:absolute;inset:0;z-index:0}
.pillars-bg img{width:100%;height:120%;object-fit:cover;opacity:.35;filter:saturate(1.1);will-change:transform}
.pillars-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,var(--bg),rgba(13,12,11,.55) 30%,rgba(13,12,11,.55) 70%,var(--bg))}
.pillars-inner{position:relative;z-index:2;max-width:1400px;margin:0 auto}
.pillars h2{font-size:clamp(44px,7vw,110px);margin-bottom:10vh}
.pillar{border-top:1px solid rgba(236,230,216,.15);padding:48px 0;display:grid;grid-template-columns:80px 1fr 2fr;gap:32px;align-items:baseline;opacity:0;transform:translateY(60px)}
.pillar .idx{font-family:var(--display);font-size:22px;color:var(--accent)}
.pillar h3{font-family:var(--display);font-size:clamp(28px,3.6vw,54px);text-transform:uppercase;letter-spacing:.02em}
.pillar p{font-size:16px;font-weight:300;line-height:1.7;color:rgba(236,230,216,.7);max-width:560px}

/* ============ WORK ============ */
.work{position:relative;padding:18vh 6vw;background:
  linear-gradient(rgba(13,12,11,.92),rgba(13,12,11,.92)),
  repeating-linear-gradient(90deg,rgba(225,80,42,.06) 0 1px,transparent 1px 120px)}
.work-inner{max-width:1400px;margin:0 auto}
.work h2{font-size:clamp(44px,7vw,110px);margin-bottom:10vh}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.card{position:relative;border:1px solid rgba(236,230,216,.12);border-radius:6px;padding:44px 36px;min-height:380px;
  display:flex;flex-direction:column;justify-content:space-between;background:rgba(236,230,216,.02);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .5s;overflow:hidden;opacity:0;transform:translateY(80px)}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),rgba(225,80,42,.12),transparent 45%);opacity:0;transition:opacity .4s}
.card:hover{transform:translateY(-10px) rotate(-.5deg);border-color:rgba(225,80,42,.6);box-shadow:0 30px 60px -20px rgba(225,80,42,.25)}
.card:hover::before{opacity:1}
.card .tag{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent)}
.card h3{font-family:var(--display);font-size:clamp(26px,2.6vw,40px);text-transform:uppercase;margin:18px 0 14px}
.card p{font-size:15px;font-weight:300;line-height:1.65;color:rgba(236,230,216,.7)}
.card .arrow{align-self:flex-end;font-size:28px;color:var(--accent);transform:translateX(0);transition:transform .4s}
.card:hover .arrow{transform:translateX(10px)}

/* ============ FINALE ============ */
.finale{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14vh 6vw;position:relative;overflow:hidden}
.finale::before{content:'';position:absolute;width:120vw;height:120vw;border-radius:50%;
  background:radial-gradient(circle,rgba(225,80,42,.12),transparent 55%);pointer-events:none}
.finale h2{font-size:clamp(52px,10vw,160px);position:relative;z-index:2}
.finale h2 .hollow{color:transparent;-webkit-text-stroke:2px var(--accent)}
.finale p{margin:32px 0 48px;font-weight:300;font-size:18px;color:rgba(236,230,216,.7);position:relative;z-index:2}
.btns{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;position:relative;z-index:2}
.btn{font-family:var(--body);font-size:14px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;
  padding:20px 48px;border-radius:100px;transition:.35s}
.btn.solid{background:var(--accent);color:var(--bg);font-weight:700}
.btn.solid:hover{transform:scale(1.05);box-shadow:0 10px 40px rgba(225,80,42,.45)}
.btn.ghost{border:1px solid rgba(236,230,216,.35);color:var(--cream)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;
  padding:40px 6vw;border-top:1px solid rgba(236,230,216,.08);font-size:13px;color:rgba(236,230,216,.45)}
footer .socials{display:flex;gap:28px}
footer a{color:rgba(236,230,216,.65);text-decoration:none;letter-spacing:.12em;text-transform:uppercase;font-size:12px;transition:.3s}
footer a:hover{color:var(--accent)}

@media(max-width:768px){
  .pillar{grid-template-columns:1fr;gap:10px}
  nav{padding:18px 20px}
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="progress" id="progress"></div>

<nav>
  <a class="logo" href="#">NP</a>
  <a class="cta" href="#hire">Book a call</a>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-pin">
    <div class="hero-stage">
      <div class="hero-fallback" id="heroFallback"></div>
      <div class="hero-img-wrap" id="heroImgWrap">
        <img id="heroImg" src="assets/hero.jpg" alt="Neeraj Prakash">
      </div>
      <div class="hero-sweep" id="heroSweep"></div>
      <div class="hero-vignette"></div>
    </div>
    <div class="hero-title">
      <div class="hero-kicker" id="heroKicker"></div>
      <h1 id="heroName"></h1>
      <div class="hero-sub" id="heroSub"></div>
    </div>
    <div class="scroll-hint">Scroll</div>
  </div>
</section>

<!-- STATS -->
<section class="stats">
  <div class="stats-grid" id="statsGrid"></div>
</section>

<!-- PILLARS -->
<section class="pillars">
  <div class="pillars-bg"><img id="builderImg" src="assets/builder.jpg" alt="" onerror="this.style.display='none'"></div>
  <div class="pillars-inner">
    <div class="kicker">What I do</div>
    <h2 class="big">Three<br>Pillars</h2>
    <div id="pillarsList"></div>
  </div>
</section>

<!-- WORK -->
<section class="work">
  <div class="work-inner">
    <div class="kicker">Selected work</div>
    <h2 class="big">The Ship</h2>
    <div class="cards" id="cards"></div>
  </div>
</section>

<!-- FINALE -->
<section class="finale" id="hire">
  <h2 class="big">Let's build<br><span class="hollow">something real</span></h2>
  <p id="finaleSub"></p>
  <div class="btns">
    <a class="btn solid" id="btnHire" href="#">Hire me</a>
    <a class="btn ghost" id="btnCall" href="#">Book a call</a>
  </div>
</section>

<footer>
  <span id="footerCopy"></span>
  <div class="socials" id="socials"></div>
</footer>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script>
/* CDN fallback if local vendor files are missing */
if (typeof gsap === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\/script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"><\/script>');
</script>
<script>
/* ================= CONFIG — EDIT EVERYTHING HERE ================= */
const CONFIG = {
  name: "NEERAJ PRAKASH",
  kicker: "Senior AI Product & Analytics Leader",
  subtitle: 'I turn <span class="accent">AI and data</span> into measurable business impact — across aviation, SaaS, e-commerce and BFSI.',
  stats: [
    {value: 10,  prefix: "",  suffix: "+",   label: "Years of experience"},
    {value: 500, prefix: "₹", suffix: "Cr+", label: "Business impact driven"},
    {value: 3000,prefix: "",  suffix: "+",   label: "Enterprise users enabled"},
    {value: 35,  prefix: "",  suffix: "%",   label: "Faster decisions via EKO AI"}
  ],
  pillars: [
    {title: "AI Product Leadership", desc: "Built and launched EKO, an AI-powered ChatGPT platform at Bangalore International Airport — cutting decision cycle time by 35%, lifting passenger satisfaction by 13% and reducing costs by 7%."},
    {title: "Commercial & Retail Analytics", desc: "Leading commercial analytics across duty-free, retail and F&B — passenger segmentation, dynamic pricing and real-time revenue dashboards that shape GTM, promotions and leasing strategy."},
    {title: "Data & Digital Transformation", desc: "From predictive models and automated BI at Amazon to SaaS analytics adoption for 3,000+ enterprise users at Bidgely — grounded in IIT Ropar AI and IIM Visakhapatnam product strategy."}
  ],
  projects: [
    {tag: "SaaS / Product", title: "Xyrenis", pitch: "Project tracking tool built end-to-end — a single source of truth from backlog to launch, designed for teams that ship."},
    {tag: "AI / Simulation", title: "Duty Free Digital Twin", pitch: "Digital twin of airport duty-free operations — simulating demand, pricing and passenger flow so commercial decisions are tested before they hit the floor."},
    {tag: "Analytics", title: "Retail Analytics", pitch: "Passenger profile-based retail targeting engine and real-time revenue dashboard suite across duty-free, retail and F&B."}
  ],
  finaleSub: "Open to leadership roles in Analytics, Data Product Management and Digital Transformation.",
  email: "neeprkash@outlook.com",
  bookCallUrl: "mailto:neeprkash@outlook.com?subject=Let's%20talk",
  socials: [
    {label: "LinkedIn", url: "https://www.linkedin.com/in/neerajprakash27"},
    {label: "GitHub",   url: "https://github.com/"},
    {label: "X",        url: "https://x.com/"}
  ]
};
/* ================================================================= */

/* --- populate (runs regardless of GSAP availability) --- */
const nameEl = document.getElementById('heroName');
const words = CONFIG.name.split(' ');
nameEl.innerHTML = words.map(w =>
  `<span class="ln">${[...w].map(c => `<span class="ch">${c}</span>`).join('')}</span>`
).join('');
document.getElementById('heroKicker').textContent = CONFIG.kicker;
document.getElementById('heroSub').innerHTML = CONFIG.subtitle;
document.getElementById('statsGrid').innerHTML = CONFIG.stats.map(s =>
  `<div class="stat"><div class="num">${s.prefix ? `<sup>${s.prefix}</sup>` : ''}<span class="count" data-v="${s.value}">0</span><sup>${s.suffix}</sup></div><div class="lbl">${s.label}</div></div>`
).join('');
document.getElementById('pillarsList').innerHTML = CONFIG.pillars.map((p,i) =>
  `<div class="pillar"><div class="idx">0${i+1}</div><h3>${p.title}</h3><p>${p.desc}</p></div>`
).join('');
document.getElementById('cards').innerHTML = CONFIG.projects.map(p =>
  `<div class="card"><div><div class="tag">${p.tag}</div><h3>${p.title}</h3><p>${p.pitch}</p></div><div class="arrow">&rarr;</div></div>`
).join('');
document.getElementById('finaleSub').textContent = CONFIG.finaleSub;
document.getElementById('btnHire').href = `mailto:${CONFIG.email}?subject=Hiring%20inquiry`;
document.getElementById('btnCall').href = CONFIG.bookCallUrl;
document.getElementById('footerCopy').textContent = `© ${new Date().getFullYear()} ${CONFIG.name.split(' ')[0]} — built to ship`;
document.getElementById('socials').innerHTML = CONFIG.socials.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join('');

/* --- hero image fallback --- */
const heroImg = document.getElementById('heroImg');
heroImg.onerror = () => {
  document.getElementById('heroImgWrap').style.display = 'none';
  document.getElementById('heroFallback').style.display = 'block';
};

/* --- graceful degradation: if GSAP failed to load, show everything --- */
if (typeof gsap === 'undefined') {
  document.querySelectorAll('.hero-title .ch').forEach(c => c.style.transform = 'none');
  document.querySelector('.hero-sub').style.opacity = 1;
  document.querySelectorAll('.pillar,.card').forEach(el => { el.style.opacity = 1; el.style.transform = 'none'; });
  document.querySelectorAll('.count').forEach(el => el.textContent = el.dataset.v);
  throw new Error('GSAP unavailable — static fallback rendered');
}
gsap.registerPlugin(ScrollTrigger);

/* --- hero cinematic scrub (orbit feel: 3D yaw + scale + light sweep) --- */
const heroTl = gsap.timeline({
  scrollTrigger: {trigger: '.hero', start: 'top top', end: 'bottom bottom', scrub: 0.7}
});
heroTl
  .fromTo('#heroImgWrap', {scale: 1.18, rotationY: -7, transformPerspective: 1200},
    {scale: 1.0, rotationY: 7, ease: 'none'}, 0)
  .fromTo('#heroSweep', {'--sx': '15%'}, {'--sx': '85%', ease: 'none'}, 0)
  .to('.hero-title', {yPercent: -30, ease: 'none'}, 0)
  .to('.scroll-hint', {opacity: 0}, 0);

/* letters track in */
gsap.to('.hero-title .ch', {
  y: 0, stagger: 0.045, ease: 'power4.out', duration: 1.1, delay: 0.25
});
gsap.to('.hero-kicker', {opacity: 1, duration: 0.8, delay: 0.15});
gsap.to('.hero-sub', {opacity: 1, duration: 1.2, delay: 1.1});

/* progress bar */
gsap.to('#progress', {width: '100%', ease: 'none',
  scrollTrigger: {trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: 0.3}});

/* --- stats count up --- */
document.querySelectorAll('.count').forEach(el => {
  const v = +el.dataset.v;
  ScrollTrigger.create({
    trigger: el, start: 'top 85%', once: true,
    onEnter: () => gsap.to(el, {innerText: v, duration: 1.8, snap: {innerText: 1}, ease: 'power2.out'})
  });
});

/* --- pillars reveal + bg parallax --- */
gsap.utils.toArray('.pillar').forEach((p, i) => {
  gsap.to(p, {opacity: 1, y: 0, duration: 0.9, ease: 'power3.out',
    scrollTrigger: {trigger: p, start: 'top 85%', once: true}});
});
gsap.to('.pillars-bg img', {yPercent: -12, ease: 'none',
  scrollTrigger: {trigger: '.pillars', start: 'top bottom', end: 'bottom top', scrub: 0.6}});

/* --- cards reveal + mouse glow --- */
gsap.utils.toArray('.card').forEach((c, i) => {
  gsap.to(c, {opacity: 1, y: 0, duration: 0.9, delay: i * 0.08, ease: 'power3.out',
    scrollTrigger: {trigger: '.cards', start: 'top 80%', once: true}});
  c.addEventListener('mousemove', e => {
    const r = c.getBoundingClientRect();
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
});

/* test hook: #s=N scrolls to N*viewportHeight (used for automated visual verification) */
addEventListener('load', () => {
  const m = location.hash.match(/#s=([\d.]+)/);
  if (m) setTimeout(() => scrollTo(0, parseFloat(m[1]) * innerHeight), 300);
});

/* --- finale hollow fill --- */
gsap.from('.finale h2', {yPercent: 20, opacity: 0, duration: 1, ease: 'power3.out',
  scrollTrigger: {trigger: '.finale', start: 'top 70%', once: true}});
</script>
</body>
</html>
